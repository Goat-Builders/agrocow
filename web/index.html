<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AgroCow</title>
  <meta name="description" content="AgroCow: cámaras y visión artificial que le dicen al recorredor de feedlot a qué animal revisar primero, sin tocar al animal.">
  <meta name="theme-color" content="#0F1A14">
  <meta property="og:title" content="AgroCow">
  <meta property="og:description" content="Cuatro segundos por vaca. AgroCow le da al recorredor cuatro días de ventaja.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/png" sizes="32x32" href="brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="brand/favicon-64.png">
  <link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
  <!-- El póster del fondo es lo más grande de la primera pantalla: se pide de entrada. -->
  <link rel="preload" as="image" type="image/avif" fetchpriority="high"
        imagesrcset="media/scene-b-poster-640.avif 640w, media/scene-b-poster-960.avif 960w"
        imagesizes="100vw">
  <!-- La intro de marca corre una vez por sesión y no se repite al recargar en medio de una presentación. -->
  <script>try{var h=location.hash;if(location.search.indexOf('nointro')>-1||sessionStorage.getItem('agrocow-intro')||(h&&h!=='#inicio')){document.documentElement.classList.add('no-intro')}else{sessionStorage.setItem('agrocow-intro','1')}}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#contenido">Saltar al contenido</a>

  <!-- Intro de marca: corta, no bloquea (ni clics ni teclado) y se salta con movimiento reducido -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-box">
      <img class="intro-logo" src="brand/agrocow-logo-480.webp" alt="" width="480" height="86" decoding="async">
    </div>
  </div>

  <header class="top glass">
    <a class="brand" href="#inicio" data-goto="0">
      <picture>
        <source media="(max-width: 520px)" srcset="brand/favicon-64.png">
        <source type="image/webp" srcset="brand/agrocow-logo-240.webp 240w, brand/agrocow-logo-480.webp 480w" sizes="10.5rem">
        <img class="brand-logo" src="brand/agrocow-logo-240.png" alt="AgroCow, ir al inicio" width="240" height="43" decoding="async">
      </picture>
    </a>
    <!-- Teclado: → / Espacio avanzan, ← vuelve, 1–7 salta, F pantalla completa (ver web/README.md) -->
    <div class="hud" id="hud">
      <span class="hud-label" id="hudLabel" aria-hidden="true">Inicio</span>
      <button type="button" class="icon-btn" id="btnPrev" aria-label="Anterior"><span aria-hidden="true">‹</span></button>
      <div class="hud-count" aria-hidden="true"><span id="hudNum">00</span><span class="hud-sep">/ 07</span></div>
      <button type="button" class="icon-btn" id="btnNext" aria-label="Siguiente"><span aria-hidden="true">›</span></button>
    </div>
    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
  </header>

  <!-- Fondo: video real de vacas que avanza cuadro a cuadro con el scroll (técnica de scroll-world). Decorativo. -->
  <div class="stage" id="stage" aria-hidden="true"></div>

  <main id="contenido"></main>

  <p class="sr-only" id="live" aria-live="polite"></p>
  <noscript><p class="noscript">AgroCow necesita JavaScript para mostrar esta presentación. El resumen del proyecto está en el README del repositorio.</p></noscript>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
